; Real CBCT/DICOM exports are routinely 100-500MB+ (a full volumetric scan
; has hundreds of slices) -- far past PHP's conservative shared-hosting
; defaults, which reject the whole request before Laravel ever sees it
; ("POST data is too large"). .user.ini is the standard, safe per-directory
; override for PHP-FPM (the common cPanel setup) -- unlike .htaccess
; php_value directives, an unsupported key here is ignored rather than
; fatally erroring the whole site. Takes effect within user_ini.cache_ttl
; (PHP's default: 5 minutes) after deploy, not instantly.
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
max_file_uploads = 50
